# Login identity for the dashboard UI, separate from the "kubernetes-dashboard"
# ServiceAccount the pod itself runs as (that one only has the minimal RBAC
# the recommended.yaml ships, just enough to run).
#
# IMPORTANT: don't put this account's token anywhere persistent (nginx
# config, a committed Secret, etc.) -- that's exactly what leaked in the
# old /kubernetes/ nginx location this replaces. Generate a short-lived
# token on demand when you need to log in:
#   kubectl create token dashboard-admin -n kubernetes-dashboard --duration=1h
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dashboard-admin
  namespace: kubernetes-dashboard
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dashboard-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
- kind: ServiceAccount
  name: dashboard-admin
  namespace: kubernetes-dashboard
