services:
  openhands:
    image: ghcr.io/openhands/agent-canvas:1.13.0
    container_name: openhands
    restart: unless-stopped
    runtime: nvidia
    group_add:
      - "135"  # host "docker" group -> lets the container use /var/run/docker.sock directly
      - "501"  # host "abelardojara" group -> lets the container read the ssh-agent socket + ssh config
    ports:
      - "8093:8000"
    environment:
      - AGENT_CANVAS_BASE_PATH=/canvas
      # GPU visibility only (nvidia-smi/monitoring) — "utility" excludes the
      # "compute" capability so this container can't allocate GPU memory or
      # run CUDA workloads that would compete with vLLM's inference.
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=utility
      - SSH_AUTH_SOCK=/ssh-agent.sock
    volumes:
      - ~/containers/openhands:/home/openhands/.openhands
      - ~/agent-projects:/projects
      # Same absolute path as code-server's workspace mount, so paths an
      # agent writes/reports line up with what code-server (and you) see.
      - ~/workspace:/home/abelardojarab/workspace
      # Docker control: full host-level docker socket. Equivalent to root on
      # the host — anything that can reach this socket can escalate via a
      # privileged container. Accepted tradeoff per user request.
      - /var/run/docker.sock:/var/run/docker.sock
      # SSH via agent forwarding (not raw key files): the container gets to
      # request signing operations through the host's live gnome-keyring
      # ssh-agent, but never receives the private key bytes themselves.
      - /run/user/501/keyring/ssh:/ssh-agent.sock
      - ~/.ssh/known_hosts:/home/openhands/.ssh/known_hosts:ro
      - ~/.ssh/config:/home/openhands/.ssh/config:ro

  chat-bridge:
    build: ./chat-bridge
    container_name: chat-bridge
    restart: unless-stopped
    depends_on:
      - openhands
    environment:
      - OPENHANDS_BASE_URL=http://openhands:8000
      - OPENHANDS_WORKSPACE=/projects/workspace
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_ALLOWED_CHAT_IDS=${TELEGRAM_ALLOWED_CHAT_IDS}
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN}
      - DISCORD_ALLOWED_CHANNEL_IDS=${DISCORD_ALLOWED_CHANNEL_IDS}
    volumes:
      # Read-only: the bridge only needs to authenticate to openhands, not
      # write anything back into its state dir. uid/gid 10001 (baked into
      # the chat-bridge image) matches this file's owner so it's readable
      # without loosening its 600 permissions.
      - ~/containers/openhands/agent-canvas/api-key.txt:/run/secrets/openhands-api-key:ro
      - ~/containers/chat-bridge:/data

  searxng:
    image: docker.io/searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped
    # Reachable by name (http://searxng:8080) from other containers on
    # stack_default -- librechat's and openhands' MCP search tool. Also
    # published on 127.0.0.1:8081 (loopback only, not the public internet) so
    # host-side processes -- the mcp-searxng server spawned directly by the
    # claude-* wrappers via npx -- can reach it too.
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      - SEARXNG_BASE_URL=http://searxng:8080/
    volumes:
      - ~/containers/searxng:/etc/searxng

  librechat-mongodb:
    image: mongo:8.0.20
    container_name: librechat-mongodb
    restart: unless-stopped
    command: mongod --noauth
    volumes:
      - ~/containers/librechat/mongodb:/data/db

  vectordb:
    image: pgvector/pgvector:0.8.0-pg15-trixie
    container_name: vectordb
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${RAG_POSTGRES_DB}
      - POSTGRES_USER=${RAG_POSTGRES_USER}
      - POSTGRES_PASSWORD=${RAG_POSTGRES_PASSWORD}
    volumes:
      - ~/containers/librechat/vectordb:/var/lib/postgresql/data

  rag_api:
    image: registry.librechat.ai/danny-avila/librechat-rag-api-dev-lite:latest
    container_name: rag_api
    restart: unless-stopped
    depends_on:
      - vectordb
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DB_HOST=vectordb
      - RAG_PORT=8000
      - POSTGRES_DB=${RAG_POSTGRES_DB}
      - POSTGRES_USER=${RAG_POSTGRES_USER}
      - POSTGRES_PASSWORD=${RAG_POSTGRES_PASSWORD}
      - EMBEDDINGS_PROVIDER=${EMBEDDINGS_PROVIDER}
      - EMBEDDINGS_MODEL=${EMBEDDINGS_MODEL}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL}

  librechat:
    image: registry.librechat.ai/danny-avila/librechat-dev:latest
    container_name: librechat
    restart: unless-stopped
    user: "501:501"
    depends_on:
      - librechat-mongodb
      - vllm
      - rag_api
      - cli-proxy-api
      # vllm:
      #   condition: service_healthy
    ports:
      - "3080:3080"
    environment:
      - HOST=0.0.0.0
      - PORT=3080
      # HOME=/ for uid 501 in this image -> npm defaults its cache to the
      # unwritable /.npm, which breaks every npx-launched MCP server (fetch,
      # search). Point it at /tmp instead, writable by any uid.
      - NPM_CONFIG_CACHE=/tmp/npm-cache
      - MONGO_URI=mongodb://librechat-mongodb:27017/LibreChat
      - DOMAIN_CLIENT=https://jaraberrocal.readmyblog.org/librechat
      - DOMAIN_SERVER=https://jaraberrocal.readmyblog.org/librechat
      - ALLOW_REGISTRATION=false
      - ALLOW_EMAIL_LOGIN=true
      - SEARCH=false
      - CREDS_KEY=ccc1e562df3904c8dd316d8cc426ba02a71f12d19bd54201b5bee9d0475a03f0
      - CREDS_IV=5d797dd0be8c670df1384dd6b2dbcdf0
      - JWT_SECRET=ae246ea3499c911bda5d85254a9f313681781fca2dbd3b2030665b219dc61ca2
      - JWT_REFRESH_SECRET=fbc13972aabe4a14e54fdad62004084129e82f2a23608f56187518a630748116
      - GOOGLE_KEY=${GOOGLE_KEY}
      - ANTHROPIC_KEY=${ANTHROPIC_KEY}
      - CLI_PROXY_API_KEY=${CLI_PROXY_API_KEY}
      - RAG_API_URL=http://rag_api:8000
    volumes:
      - ~/containers/librechat/images:/app/client/public/images
      - ~/containers/librechat/uploads:/app/uploads
      - ~/containers/librechat/logs:/app/logs
      - ~/containers/librechat/data:/app/data
      - ~/containers/librechat/librechat.yaml:/app/librechat.yaml:ro
      # Scoped for the filesystem MCP server only -- not the whole home dir,
      # since this container is exposed on the public domain. Mounted at the
      # same in-container path as OpenHands' workspace mount so paths shown
      # in tool output are consistent between the two apps.
      - ~/workspace:/home/abelardojarab/workspace

  heimdall:
    image: linuxserver/heimdall
    container_name: heimdall
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    ports:
      - "7888:80"
    environment:
      - PUID=501
      - PGID=501
    volumes:
      - ~/containers/heimdall:/config

  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: uptime-kuma
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    ports:
      - "3011:3001"
    volumes:
      - ~/containers/uptime-kuma:/app/data

  watchtower:
    image: containrrr/watchtower
    container_name: watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --cleanup --label-enable

  portainer:
    image: portainer/portainer-ce
    container_name: portainer
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    ports:
      - "9010:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ~/containers/portainer:/data

  authentik-db:
    image: postgres:16-alpine
    container_name: authentik-db
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      start_period: 20s
      interval: 30s
      retries: 5
      timeout: 5s
    environment:
      - POSTGRES_DB=authentik
      - POSTGRES_USER=authentik
      - POSTGRES_PASSWORD=${AUTHENTIK_PG_PASS}
    volumes:
      - ~/containers/authentik/database:/var/lib/postgresql/data

  authentik-redis:
    image: redis:alpine
    container_name: authentik-redis
    restart: unless-stopped
    command: --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      start_period: 20s
      interval: 30s
      retries: 5
      timeout: 3s
    volumes:
      - ~/containers/authentik/redis:/data

  authentik-server:
    image: ghcr.io/goauthentik/server:${AUTHENTIK_TAG:-2024.10.4}
    container_name: authentik-server
    restart: unless-stopped
    command: server
    depends_on:
      - authentik-db
      - authentik-redis
    environment:
      - AUTHENTIK_SECRET_KEY=${AUTHENTIK_SECRET_KEY}
      - AUTHENTIK_REDIS__HOST=authentik-redis
      - AUTHENTIK_POSTGRESQL__HOST=authentik-db
      - AUTHENTIK_POSTGRESQL__USER=authentik
      - AUTHENTIK_POSTGRESQL__NAME=authentik
      - AUTHENTIK_POSTGRESQL__PASSWORD=${AUTHENTIK_PG_PASS}
      # nginx terminates TLS in front of this; authentik only needs to be
      # reachable over plain http on the docker network / localhost.
      - AUTHENTIK_DISABLE_STARTUP_ANALYTICS=true
      # Break-glass akadmin login (only takes effect while the instance has
      # no users yet) + the value the abelardojara blueprint reads.
      - AUTHENTIK_BOOTSTRAP_EMAIL=${AUTHENTIK_BOOTSTRAP_EMAIL}
      - AUTHENTIK_BOOTSTRAP_PASSWORD=${AUTHENTIK_BOOTSTRAP_PASSWORD}
      - AUTHENTIK_ABELARDOJARA_PASSWORD=${AUTHENTIK_ABELARDOJARA_PASSWORD}
    volumes:
      - ~/containers/authentik/media:/media
      - ~/containers/authentik/templates:/templates
      - ~/containers/authentik/blueprints/local:/blueprints/local
    ports:
      # nginx (host) reaches the embedded outpost through this, same
      # localhost-published pattern as heimdall/portainer/mlflow/etc.
      - "127.0.0.1:9011:9000"

  authentik-worker:
    image: ghcr.io/goauthentik/server:${AUTHENTIK_TAG:-2024.10.4}
    container_name: authentik-worker
    restart: unless-stopped
    command: worker
    depends_on:
      - authentik-db
      - authentik-redis
    environment:
      - AUTHENTIK_SECRET_KEY=${AUTHENTIK_SECRET_KEY}
      - AUTHENTIK_REDIS__HOST=authentik-redis
      - AUTHENTIK_POSTGRESQL__HOST=authentik-db
      - AUTHENTIK_POSTGRESQL__USER=authentik
      - AUTHENTIK_POSTGRESQL__NAME=authentik
      - AUTHENTIK_POSTGRESQL__PASSWORD=${AUTHENTIK_PG_PASS}
      - AUTHENTIK_BOOTSTRAP_EMAIL=${AUTHENTIK_BOOTSTRAP_EMAIL}
      - AUTHENTIK_BOOTSTRAP_PASSWORD=${AUTHENTIK_BOOTSTRAP_PASSWORD}
      - AUTHENTIK_ABELARDOJARA_PASSWORD=${AUTHENTIK_ABELARDOJARA_PASSWORD}
    volumes:
      - ~/containers/authentik/media:/media
      - ~/containers/authentik/templates:/templates
      - ~/containers/authentik/certs:/certs
      - ~/containers/authentik/blueprints/local:/blueprints/local

  guacd:
    image: guacamole/guacd
    container_name: guacd
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    networks:
      - guacnet

  guacamole:
    image: guacamole/guacamole
    container_name: guacamole
    depends_on:
      - guacd
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    ports:
      - "8190:8080"
    environment:
      - GUACD_HOSTNAME=guacd
      - MYSQL_HOSTNAME=192.168.3.2
      - MYSQL_PORT=3306
      - MYSQL_DATABASE=guacamole_db
      - MYSQL_USER=guacuser
      - MYSQL_PASSWORD=guacpass
    networks:
      - guacnet

  calibre-web:
    image: linuxserver/calibre-web
    container_name: calibre-web
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    ports:
      - "8084:8083"
    environment:
      - PUID=501
      - PGID=501
    volumes:
      - ~/containers/calibre-web:/config
      - ~/Calibre Library:/books

  nextcloud:
    image: nextcloud:31
    container_name: nextcloud
    restart: unless-stopped
    ports:
      - "8890:80"
    # The host's /etc/hosts maps jaraberrocal.readmyblog.org to a
    # host-specific loopback IP (127.2.1.1) that only makes sense in the
    # host's own network namespace. Inside this container Docker's embedded
    # DNS forwards to that same resolver chain, so self-checks (WebDAV,
    # .mjs, ocs/ocm-provider, heartbeat) tried to connect to 127.2.1.1 from
    # inside the container's netns, where nothing listens -> connection
    # refused. Pin it straight to the host gateway instead, where nginx is
    # actually listening.
    extra_hosts:
      - "jaraberrocal.readmyblog.org:host-gateway"
    environment:
      - MYSQL_PASSWORD=qitlrtsx
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=nextcloud
      - MYSQL_HOST=192.168.3.2
      - NEXTCLOUD_TRUSTED_DOMAINS=jaraberrocal.readmyblog.org
      - OVERWRITEPROTOCOL=https
      - OVERWRITECLIURL=https://jaraberrocal.readmyblog.org/nextcloud
      - OVERWRITEWEBROOT=/nextcloud
    volumes:
      - ~/containers/nextcloud/html:/var/www/html
      - ~/containers/nextcloud/config:/var/www/html/config
      - ~/containers/nextcloud/data:/var/www/html/data

  code-server:
    image: linuxserver/code-server
    container_name: code-server
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    ports:
      - "8085:8443"
    environment:
      - PUID=501
      - PGID=501
      - TZ=Etc/UTC
      - PASSWORD=qitlrtsx
      - SUDO_PASSWORD=qitlrtsx
      - PROXY_DOMAIN=/code-server
    volumes:
       - /var/run/docker.sock:/var/run/docker.sock
       - ~/containers/code-server/config:/config
       - ~/workspace:/home/abelardojarab/workspace

  drawio:
    image: jgraph/drawio
    container_name: drawio
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    ports:
      - "8087:8080"
    environment:
      - PUID=501
      - PGID=501

  mlflow-db:
    image: postgres:15
    container_name: mlflow-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=mlflow
      - POSTGRES_PASSWORD=mlflowpass
      - POSTGRES_DB=mlflow
    volumes:
      - ~/containers/mlflow/db:/var/lib/postgresql/data

  minio:
    image: minio/minio
    container_name: minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"  # Web UI for managing buckets
    environment:
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=qitlrtsx
    command: server /data --console-address ":9001"
    volumes:
      - ~/containers/minio/data:/data

  mlflow:
    image: burakince/mlflow:latest  # This image includes psycopg2
    container_name: mlflow
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    ports:
      - "5002:5002"
    depends_on:
      - mlflow-db
      - minio
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5002
      --backend-store-uri postgresql://mlflow:mlflowpass@mlflow-db:5432/mlflow
      --default-artifact-root s3://mlflow/
    environment:
      - AWS_ACCESS_KEY_ID=admin
      - AWS_SECRET_ACCESS_KEY=qitlrtsx
      - MLFLOW_S3_ENDPOINT_URL=http://minio:9000
      # nginx proxies with `proxy_set_header Host $host`, so the tracking
      # server sees the public domain as the Host header. MLflow 3.5+'s
      # built-in DNS-rebinding protection only allows localhost/private-IP
      # hosts by default and rejects that with "Invalid Host header -
      # possible DNS rebinding attack detected" — explicitly allow it.
      # Setting this env var replaces MLflow's default allow-list entirely
      # (localhost/127.0.0.1/private-IP patterns), so keep those alongside
      # the public domain or local/internal access (health checks, direct
      # curl to 127.0.0.1:5002) breaks too.
      - MLFLOW_SERVER_ALLOWED_HOSTS=jaraberrocal.readmyblog.org,jaraberrocal.readmyblog.org:*,localhost,localhost:*,127.0.0.1,127.0.0.1:*

  adminer:
    image: adminer:latest
    container_name: adminer
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    ports:
      - "8094:8080"

  vllm:
    image: vllm/vllm-openai:v0.27.1-cu129
    container_name: vllm
    restart: unless-stopped
    runtime: nvidia
    ipc: host
    ports:
      - "8000:8000"
    environment:
      # Model's TP-relevant dim (16) isn't divisible by 3, so TP must be
      # 1/2/4/8/16. Pin to the two matching L4s (GPU 0 and 2) and leave
      # the RTX 4090 (GPU 1, already has ~3.8GB used by another process)
      # out of the pool entirely.
      - NVIDIA_VISIBLE_DEVICES=0,2
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - CUDA_DEVICE_ORDER=PCI_BUS_ID
      - HUGGINGFACE_HUB_CACHE=/models
      - HF_HOME=/models
      # Ada-generation GPUs (40-series/L4/L40) lack NVLink and often have
      # unreliable PCIe P2P, which makes NCCL hang or fail during TP init.
      - NCCL_P2P_DISABLE=1
      - NCCL_IB_DISABLE=1
    volumes:
      - /media/disk3/ollama/vllm-models:/models
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 300s
    command: >
      --model Qwen/Qwen3.8-27B-FP8
      --served-model-name qwen3.8-27b
      --max-model-len 65536
      --tensor-parallel-size 2
      --gpu-memory-utilization 0.85
      --max-num-seqs 4
      --kv-cache-dtype fp8
      --enable-prefix-caching
      --enable-auto-tool-choice
      --tool-call-parser qwen3_xml
      --speculative-config '{"method": "mtp", "num_speculative_tokens": 3}'

  litellm-claude-proxy:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: litellm-claude-proxy
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    depends_on:
      - vllm
      - cli-proxy-api
    ports:
      - "4001:4000"
    environment:
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      - CLI_PROXY_API_KEY=${CLI_PROXY_API_KEY}
    volumes:
      - ~/containers/litellm/config.yaml:/app/config.yaml:ro
      - ~/containers/litellm/custom_callbacks.py:/app/custom_callbacks.py:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]

  # Wraps a Gemini CLI Code Assist Enterprise OAuth session as an
  # OpenAI-compatible endpoint that litellm-claude-proxy routes to.
  # https://github.com/router-for-me/CLIProxyAPI
  # First-time setup: this build's `--help` has no standalone gemini-login
  # flag -- Gemini/Code Assist auth goes through Google Antigravity's shared
  # OAuth backend instead. Run `docker exec cli-proxy-api /CLIProxyAPI/CLIProxyAPI
  # -antigravity-login -no-browser`, then open the printed URL and sign in
  # with the Code Assist Enterprise account.
  cli-proxy-api:
    image: eceasy/cli-proxy-api:latest
    container_name: cli-proxy-api
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    ports:
      - "8317:8317"
      # OAuth loopback callback ports used only during `--login`, one per
      # supported provider (Gemini/Codex/Claude/Grok) -- kept published so
      # the login flow works without editing compose each time.
      - "18085:8085"  # host 8085 already taken by code-server
      - "1455:1455"
      - "54545:54545"
      - "51121:51121"
      - "11451:11451"
    volumes:
      - ~/containers/cli-proxy-api/config.yaml:/CLIProxyAPI/config.yaml
      - ~/containers/cli-proxy-api/auth:/root/.cli-proxy-api
      - ~/containers/cli-proxy-api/logs:/CLIProxyAPI/logs
      - ~/containers/cli-proxy-api/plugins:/CLIProxyAPI/plugins

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    depends_on:
      - vllm
      # vllm:
      #   condition: service_healthy
    ports:
      - "8091:8080"
    environment:
      - OPENAI_API_BASE_URL=http://vllm:8000/v1
      - OPENAI_API_KEY=not-needed
      - ENABLE_OLLAMA_API=true
      - OLLAMA_BASE_URL=http://192.168.3.13:11434
    volumes:
      - ~/containers/open-webui:/app/backend/data

  onlyoffice-documentserver:
    image: onlyoffice/documentserver:9.4.0.1
    container_name: onlyoffice-documentserver
    restart: unless-stopped
    ports:
      # Bound to localhost only — reached through nginx at /onlyoffice/,
      # matching every other app in this stack (mlflow, drawio, portainer…).
      - "127.0.0.1:8096:80"
    # Document Server calls back into Nextcloud (https://.../nextcloud/...)
    # to fetch/save documents. Same host-gateway fix as the nextcloud
    # service — without it this container inherits the host's /etc/hosts
    # loopback alias for the domain and the callback connection is refused.
    extra_hosts:
      - "jaraberrocal.readmyblog.org:host-gateway"
    environment:
      - JWT_ENABLED=true
      - JWT_SECRET=${ONLYOFFICE_JWT_SECRET}
      - JWT_HEADER=Authorization
    volumes:
      - ~/containers/onlyoffice/data:/var/www/onlyoffice/Data
      - ~/containers/onlyoffice/logs:/var/log/onlyoffice
      - ~/containers/onlyoffice/lib:/var/lib/onlyoffice
      - ~/containers/onlyoffice/db:/var/lib/postgresql
      - ~/containers/onlyoffice/fonts:/usr/share/fonts/truetype/custom
    healthcheck:
      test: ["CMD-SHELL", "/usr/bin/curl -f http://localhost/healthcheck || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

  minecraft-bedrock:
    image: itzg/minecraft-bedrock-server
    container_name: bedrock
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    ports:
      - "19132:19132/udp"
    environment:
      - EULA=TRUE
    volumes:
