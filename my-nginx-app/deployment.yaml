# Throwaway smoke test: proves host-nginx -> ingress-nginx -> pod works
# end-to-end at https://k8s.jaraberrocal.readmyblog.org/demo before ArgoCD
# or any real app leans on the same path.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-nginx-app
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: my-nginx-app
  template:
    metadata:
      labels:
        app: my-nginx-app
    spec:
      containers:
      - name: nginx
        image: nginxinc/nginx-unprivileged:stable
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: my-nginx-service
  namespace: default
spec:
  selector:
    app: my-nginx-app
  ports:
  - port: 80
    targetPort: 8080
